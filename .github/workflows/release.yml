name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/nvidia-exporter_${GITHUB_REF_NAME}_linux_${arch} ./cmd/nvidia-exporter
          done
          cd dist && sha256sum * > nvidia-exporter_${GITHUB_REF_NAME}_checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release notes: this tag's section of CHANGELOG.md (between its
          # "## [vX.Y.Z]" heading and the next "## " heading), else GitHub's
          # generated notes.
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; found = index($0, "[" tag "]") > 0; next }
            found
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi
